<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMEN DRIFT — a lantern river run</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #070a18;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <script type="module">
    import { Game } from './src/main.js';

    const canvas = document.getElementById('game');
    const game = new Game(canvas);
    game.start();
    // Exposed for the headless play-test: window.__game.state, .world.score.
    window.__game = game;
  </script>
</body>
</html>
